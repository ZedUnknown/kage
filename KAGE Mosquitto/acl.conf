# Default deny. Provision each Client's runtime ACL using scripts/client-acl.ts.
# These patterns bind setup directly to the CONNECT username, never the client ID.
pattern write kage/client/setup/by-user/%u/request
pattern read kage/client/setup/by-user/%u/response/+

# Hub runtime identity: Hub usernames must equal their pre-registered Hub IDs.
pattern write kage/hub/live/%u/status
pattern write kage/hub/live/%u/occupancy/+/+
pattern write kage/hub/live/%u/ping_request
pattern read kage/hub/live/%u/ping_response
pattern read kage/hub/live/%u/identify
pattern write kage/hub/live/%u/identify_result
pattern write kage/hub/live/%u/pairing_request
pattern write kage/hub/live/%u/pairing_confirm
pattern write kage/hub/live/%u/unpair_request
pattern write kage/hub/live/%u/unpair_confirm
pattern read kage/hub/live/%u/pairing_response/+
pattern read kage/hub/live/%u/unpair_response/+

# Match this username to the independently provisioned server broker account.
user kage-server
topic read kage/client/setup/by-user/+/request
topic write kage/client/setup/by-user/+/response/+
topic read kage/client/+/+/request
topic read kage/client/+/+/presence
topic write kage/client/+/+/response
topic write kage/client/+/+/state
topic write kage/client/+/+/command
# One subscription covers Hub messages; ingestion ignores server publications.
topic read kage/hub/live/+/+
topic read kage/hub/live/+/occupancy/+/+
topic write kage/hub/live/+/ping_response
topic write kage/hub/live/+/identify
topic write kage/hub/live/+/pairing_response/+
topic write kage/hub/live/+/unpair_response/+
