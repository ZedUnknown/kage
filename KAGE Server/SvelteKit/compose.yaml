x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8060
  ORIGIN: ${ORIGIN:?Set ORIGIN in .env.docker}
  BODY_SIZE_LIMIT: 32K
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:-kage}
  DATABASE_USER: ${DATABASE_USER:-kage}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.docker}
  KAGE_ENCRYPTION_KEY: ${KAGE_ENCRYPTION_KEY:?Set KAGE_ENCRYPTION_KEY in .env.docker}

x-app-dependencies: &app-dependencies
  db:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-kage}
      POSTGRES_USER: ${DATABASE_USER:-kage}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:?Set ORIGIN in .env.docker}
    image: kage-sveltekit:local
    command: ["node", "scripts/migrate.ts"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: kage-sveltekit:local
    command: ["node", "build"]
    environment: *app-environment
    depends_on: *app-dependencies
    ports:
      - "127.0.0.1:${KAGE_PORT:-8060}:8060"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8060/auth').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  worker:
    image: kage-sveltekit:local
    command: ["node", "scripts/mqtt-worker.ts"]
    environment: *app-environment
    depends_on: *app-dependencies
    restart: unless-stopped

volumes:
  postgres_data:
