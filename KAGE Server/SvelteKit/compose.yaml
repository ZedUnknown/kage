x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8060
  PROTOCOL_HEADER: x-forwarded-proto
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?Set CORS_ALLOW_ORIGINS in .env}
  DO_NOT_TRACK: ${DO_NOT_TRACK:-true}
  BODY_SIZE_LIMIT: 32K
  DATABASE_HOST: host.docker.internal
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
  DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}

x-app-dependencies: &app-dependencies
  migrate:
    condition: service_completed_successfully

services:
  migrate:
    build:
      context: .
    image: ${DOCKER_IMAGE_NAME:?Set DOCKER_IMAGE_NAME in .env}
    command: ["node", "scripts/migrate.ts"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  web:
    image: ${DOCKER_IMAGE_NAME:?Set DOCKER_IMAGE_NAME in .env}
    container_name: ${DOCKER_CONTAINER_PREFIX:?Set DOCKER_CONTAINER_PREFIX in .env}-web
    command: ["node", "scripts/start.mjs"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-dependencies
    ports:
      - "127.0.0.1:${HOST_PORT:-8060}:8060"
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('node:http'); const origin = new URL(process.env.CORS_ALLOW_ORIGINS.split(';')[0]); http.get({ hostname: '127.0.0.1', port: 8060, path: '/auth', headers: { Host: origin.host, 'X-Forwarded-Proto': origin.protocol.slice(0, -1) } }, r => { r.resume(); process.exitCode = r.statusCode === 200 ? 0 : 1 }).on('error', () => process.exitCode = 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  worker:
    image: ${DOCKER_IMAGE_NAME:?Set DOCKER_IMAGE_NAME in .env}
    container_name: ${DOCKER_CONTAINER_PREFIX:?Set DOCKER_CONTAINER_PREFIX in .env}-worker
    command: ["node", "scripts/mqtt-worker.ts"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-dependencies
    restart: unless-stopped
